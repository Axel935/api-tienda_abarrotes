[tool.poetry]
name = "tienda-abarrotes-api"
version = "0.1.0"
description = "API REST para administrar una tienda de abarrotes (productos, ventas, compras e inventario)"
authors = ["Equipo <equipo@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0"
pydantic = "^2.7"
pyjwt = "^2.8"
bcrypt = "^4.1"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
